<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Galgo Astral — Carta Astral de tu Mascota</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">

<style>
  html, body {
    margin: 0; padding: 0;
    background: #0b0a08;
    color: #f5ecd6;
    font-family: 'Cormorant Garamond', serif;
  }
  * { box-sizing: border-box; }
  #root { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="natal-wheel.jsx"></script>
<script type="text/babel" src="design-v1.jsx"></script>
<script type="text/babel" src="design-v2.jsx"></script>
<script type="text/babel" src="design-v3.jsx"></script>

<script type="text/babel" data-presets="react">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "showAllVariants": false,
  "focusVariant": "v1",
  "headerFont": "Cormorant Garamond",
  "accentMode": "gold"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const variants = [
    { id: 'v1', label: 'I · La Carta del Templo',  width: 1280, height: 2700, Component: DesignV1, sub: 'Vintage esotérico, simétrico, ornamental' },
    { id: 'v2', label: 'II · El Observatorio',     width: 1280, height: 2400, Component: DesignV2, sub: 'Editorial moderno, asimétrico, premium' },
    { id: 'v3', label: 'III · El Templo del Galgo', width: 1280, height: 2900, Component: DesignV3, sub: 'Tarot decorativo, cartas mayores' },
  ];

  const visible = t.showAllVariants
    ? variants
    : variants.filter(v => v.id === t.focusVariant);

  return (
    <>
      <DesignCanvas
        title="Galgo Astral · Carta Astral de tu Mascota"
        subtitle="Tres direcciones para la landing de consulta · Premium · Bilingüe · Esotérico vintage"
      >
        <DCSection id="landings" title="Landing pages — direcciones de diseño">
          {visible.map(v => (
            <DCArtboard key={v.id} id={v.id} label={v.label} sublabel={v.sub} width={v.width} height={v.height}>
              <v.Component width={v.width} />
            </DCArtboard>
          ))}
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks · Galgo Astral">
        <TweakSection title="Vista">
          <TweakToggle
            label="Mostrar todas las variantes"
            value={t.showAllVariants}
            onChange={v => setTweak('showAllVariants', v)}
          />
          {!t.showAllVariants && (
            <TweakSelect
              label="Variante en foco"
              value={t.focusVariant}
              onChange={v => setTweak('focusVariant', v)}
              options={variants.map(v => ({ value: v.id, label: v.label }))}
            />
          )}
        </TweakSection>

        <TweakSection title="Tipografía display">
          <TweakRadio
            label="Fuente del título"
            value={t.headerFont}
            onChange={v => setTweak('headerFont', v)}
            options={[
              { value: 'Cormorant Garamond', label: 'Cormorant' },
              { value: 'Cinzel', label: 'Cinzel' },
            ]}
          />
        </TweakSection>

        <TweakSection title="Notas">
          <div style={{ fontSize: 12, color: 'rgba(245,236,214,0.65)', lineHeight: 1.5 }}>
            Click en cualquier artboard para verlo en pantalla completa. Arrastra para reordenar.
          </div>
        </TweakSection>
      </TweaksPanel>

      <style>{`
        h1, h2, h3 {
          font-family: '${t.headerFont}', serif !important;
        }
      `}</style>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
